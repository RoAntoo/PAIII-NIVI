

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Editar Tarea</h4>
        </div>
        <div class="card-body">

          <div *ngIf="isLoading()" class="text-center my-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-muted">Cargando datos de la tarea...</p>
          </div>

          <div *ngIf="errorMessage()" class="alert alert-danger" role="alert">
            {{ errorMessage() }}
            <button *ngIf="!task()" type="button" class="btn btn-outline-secondary" (click)="loadTask()">Reintentar</button>
          </div>

          <form *ngIf="!isLoading() && task()" [formGroup]="form" (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label for="title" class="form-label fw-bold">Título de la Tarea</label>
              <input type="text" class="form-control" id="title" formControlName="title" maxlength="255" placeholder="Ej: Actualizar base de datos" />
              <div class="text-danger small mt-1" *ngIf="form.get('title')?.touched && form.get('title')?.invalid">
                El título es obligatorio y no puede estar compuesto solo por espacios.
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="estimateHours" class="form-label fw-bold">Horas Estimadas</label>
                <input type="number" class="form-control" id="estimateHours" formControlName="estimateHours" step="1" max="2147483647" min="1" />
                <div class="text-danger small mt-1" *ngIf="form.get('estimateHours')?.touched && form.get('estimateHours')?.invalid">
                  Requerido. Debe ser un entero entre 1 y 2147483647.
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="assignee" class="form-label fw-bold">Asignado a (Opcional)</label>
                <input type="text" class="form-control" id="assignee" formControlName="assignee" maxlength="255" placeholder="Ej: jperez" />
              </div>
            </div>

            <div class="mb-3">
              <label for="status" class="form-label">Estado</label>
              <select id="status" class="form-select" formControlName="status">
                <option value="TODO">Pendiente</option>
                <option value="IN_PROGRESS">En progreso</option>
                <option value="DONE">Completada</option>
              </select>
              <label for="category" class="form-label">Categoría</label>
              <select id="category" class="form-select" formControlName="category">
                @for (category of categories; track category) { <option [value]="category">{{ categoryLabels[category] }}</option> }
              </select>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-outline-secondary" [routerLink]="['/projects', projectId, 'tasks']">Cancelar</button>

              <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSaving()">
                <span *ngIf="isSaving()" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                Guardar Cambios
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
