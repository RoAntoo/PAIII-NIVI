<ion-app>
<ion-header>
<ion-toolbar>
<nav class="navbar navbar-custom shadow-sm" aria-label="Navegación principal">
  <div class="container d-flex justify-content-between align-items-center">

    <a class="navbar-brand-custom fw-bold mb-0" routerLink="/">
      <span class="logo-icon">🌱</span> Nivi
    </a>

    @if (auth.signedIn()) {
    <ul class="nav nav-links-custom gap-2 m-0 p-0">
      <li class="nav-item">
        <a class="nav-link-custom"
           routerLink="/"
           routerLinkActive="active-link-custom"
           [routerLinkActiveOptions]="{exact: true}">
          Inicio
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link-custom"
           routerLink="/projects"
           routerLinkActive="active-link-custom">
          Proyectos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link-custom btn-new-project-nav"
           routerLink="/projects/new"
           routerLinkActive="active-link-custom">
          + Nuevo Proyecto
        </a>
      </li>
      <li class="nav-item d-flex align-items-center">
        <button type="button" class="nav-link-custom border-0 bg-transparent" (click)="auth.logout()">Cerrar sesión</button>
      </li>
    </ul>
    }

  </div>
</nav>
</ion-toolbar>
</ion-header>

<ion-content>
<main class="container app-content">
  <router-outlet></router-outlet>
</main>
</ion-content>
</ion-app>
