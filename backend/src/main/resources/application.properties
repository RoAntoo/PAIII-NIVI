spring.application.name=backend-integrator
server.port=${SERVER_PORT:8081}

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=${DB_URL:jdbc:h2:file:~/db/proyecto-db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/required-columns.sql

# Reject fractional JSON numbers instead of silently truncating task estimates.
spring.jackson.deserialization.accept-float-as-int=false

app.auth.username=${AUTH_USERNAME:}
app.auth.password=${AUTH_PASSWORD:}
app.auth.jwt-secret=${AUTH_JWT_SECRET:}
app.auth.token-ttl=PT1H
