spring.application.name=backend-integrator

# --- Configuración del Servidor Web ---
//cambie la 8080 por la 8081 - windows me tiene retenido el puerto y no me lo libera???
server.port=8081

# --- Configuración de la Base de Datos H2 (Modo Archivo) ---
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:~/db/proyecto-db
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Apply required-column constraints to existing H2 schemas after Hibernate DDL.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/required-columns.sql
