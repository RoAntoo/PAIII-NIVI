spring.datasource.url=jdbc:h2:mem:nivi_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/pr01-task-metadata.sql,classpath:db/required-columns.sql
spring.jackson.deserialization.accept-float-as-int=false
app.auth.username=test-user
app.auth.password=test-only-password
app.auth.jwt-secret=test-only-signing-key-at-least-32-bytes-long
app.auth.token-ttl=PT1H
